# Same as the compose file in README.md. Settings go in .env:
#   PUID / PGID  user and group the updater writes ./data as
#   PORT         port the app is served on
#   TAG          image tag (latest, a branch name, or sha-<commit>)
#   UPDATE_INTERVAL_HOURS, DELAY_MS
# Create the data folder first: mkdir -p data
services:
  web:
    image: ghcr.io/ithinasu/howsadisthischapter-web:${TAG:-latest}
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

  updater:
    image: ghcr.io/ithinasu/howsadisthischapter-updater:${TAG:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      UPDATE_INTERVAL_HOURS: "${UPDATE_INTERVAL_HOURS:-24}"
      DELAY_MS: "${DELAY_MS:-600}"
    volumes:
      - ./data:/data
    restart: unless-stopped
