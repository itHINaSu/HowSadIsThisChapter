# Uses the images GitHub Actions publishes on every push. To update:
#   docker compose pull && docker compose up -d
# To build from a local checkout instead, see compose.build.yml.
services:
  web:
    image: ghcr.io/ithinasu/howsadisthischapter-web:${TAG:-latest}
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - data:/data:ro
    restart: unless-stopped

  updater:
    image: ghcr.io/ithinasu/howsadisthischapter-updater:${TAG:-latest}
    environment:
      # Hours between refreshes of the ratings data.
      UPDATE_INTERVAL_HOURS: "${UPDATE_INTERVAL_HOURS:-24}"
      # Pause between book page requests, to stay gentle on the site.
      DELAY_MS: "${DELAY_MS:-600}"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
