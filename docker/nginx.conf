# Template: the nginx image fills in ${PUBLIC_URL} from the environment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

    # Data written by the updater service into the shared volume.
    location /api/ {
        alias /data/api/;
        add_header Cache-Control "no-cache";
        default_type application/json;
        try_files $uri =404;
    }

    # Server settings for the app (see src/lib/config.ts).
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '{"publicUrl":"${PUBLIC_URL}"}';
    }

    # Built JS/CSS have the content hash in their names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page, service worker and version file must revalidate so updates roll out.
    location ~* ^/(sw\.js|index\.html|manifest\.webmanifest|version\.json)$ {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; application/javascript js; text/html html; application/json json; }
    }

    # Revalidated on every load so icons swapped in via a volume show up.
    location /icons/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
