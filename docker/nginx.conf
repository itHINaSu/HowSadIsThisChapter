server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

    # Data written by the updater service into the shared volume.
    location /api/ {
        alias /data/api/;
        add_header Cache-Control "no-cache";
        default_type application/json;
        try_files $uri =404;
    }

    # The service worker and app shell must revalidate so updates roll out.
    location ~* ^/(sw\.js|index\.html|app\.js|styles\.css|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; application/javascript js; text/css css; text/html html; }
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
